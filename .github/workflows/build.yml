name: Build Kernel A145P

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Samsung Kernel Source
        uses: actions/checkout@v4

      - name: Set up Environment & Sync AOSP Toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 git curl bc bison flex libssl-dev make zip nodejs python-is-python3 rsync
          
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          export PATH="~/bin:$PATH"
          
          git config --global user.name "Behrooz140"
          git config --global user.email "behrooz140@local.dev"
          
          mkdir aosp_toolchain
          cd aosp_toolchain
          repo init -u https://android.googlesource.com/kernel/manifest -b common-android15-6.6 --depth=1
          repo sync -c -j$(nproc) --no-clone-bundle --no-tags
          
          cd ..
          mkdir -p kernel/build kernel/external kernel/prebuilts kernel/tools
          
          rsync -a --exclude=".git" --exclude=".repo" aosp_toolchain/build/ kernel/build/
          rsync -a --exclude=".git" --exclude=".repo" aosp_toolchain/external/ kernel/external/
          rsync -a --exclude=".git" --exclude=".repo" aosp_toolchain/prebuilts/ kernel/prebuilts/
          rsync -a --exclude=".git" --exclude=".repo" aosp_toolchain/tools/ kernel/tools/

      - name: Setup KernelSU
        run: |
          cd kernel-6.6
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -
          find KernelSU -type f -name "*.c" -exec sed -i '1i #undef KSU_VERSION\n#define KSU_VERSION 32525' {} +

      - name: Optimize Kernel Config (Disable Unnecessary Options)
        run: |
          echo "=== Creating optimization overlay ==="
          cat > kernel/kernel_device_modules-6.6/optimize_overlay.config << 'EOF'
          # ============================================================
          # غیرفعال‌سازی گزینه‌های غیرضروری برای بهینه‌سازی
          # ============================================================
          
          # دیباگ‌های سنگین
          # CONFIG_DEBUG_INFO_BTF is not set
          # CONFIG_KASAN_HW_TAGS is not set
          # CONFIG_UBSAN is not set
          # CONFIG_SCHED_DEBUG is not set
          # CONFIG_SCHEDSTATS is not set
          # CONFIG_HIST_TRIGGERS is not set
          # CONFIG_FTRACE is not set
          # CONFIG_CORESIGHT is not set
          # CONFIG_MTK_AEE_FEATURE is not set
          # CONFIG_MTK_AEE_AED is not set
          # CONFIG_MTK_AEE_HANGDET is not set
          # CONFIG_MTK_AEE_IPANIC is not set
          # CONFIG_MTK_HANG_DETECT is not set
          
          # دیباگ‌های سخت‌افزاری
          # CONFIG_SCSI_UFS_MEDIATEK_DBG is not set
          # CONFIG_HPB_DEBUG is not set
          # CONFIG_HPB_DEBUG_SYSFS is not set
          # CONFIG_UFSHID_DEBUG is not set
          # CONFIG_MTK_IOMMU_MISC_DBG is not set
          # CONFIG_MTK_IOMMU_MISC_TEST is not set
          # CONFIG_MTK_MMDEBUG is not set
          # CONFIG_MTK_MMINFRA is not set
          # CONFIG_MTK_DRAM_LOG_STORE is not set
          # CONFIG_MTK_IRQ_DBG is not set
          # CONFIG_MTK_BUS_PARITY_CHECK is not set
          # CONFIG_MTK_CACHE_PARITY_CHECK is not set
          # CONFIG_MTK_GIC_RAM_PARITY_CHECK is not set
          # CONFIG_MTK_SYSTRACKER_WATCHPOINT is not set
          # CONFIG_MTK_LAST_BUS is not set
          # CONFIG_MTK_DBGTOP is not set
          # CONFIG_SUBPMIC_DBG is not set
          # CONFIG_MT6370_DBG is not set
          
          # پلتفرم‌های غیرضروری
          # CONFIG_ARCH_ACTIONS is not set
          # CONFIG_ARCH_APPLE is not set
          # CONFIG_ARCH_BCM is not set
          # CONFIG_ARCH_EXYNOS is not set
          # CONFIG_ARCH_MESON is not set
          # CONFIG_ARCH_ROCKCHIP is not set
          # CONFIG_ARCH_RENESAS is not set
          # CONFIG_XEN is not set
          # CONFIG_NUMA is not set
          # CONFIG_ACPI is not set
          
          # ویژگی‌های سیستمی غیرضروری
          # CONFIG_SYSVIPC is not set
          # CONFIG_POSIX_MQUEUE is not set
          # CONFIG_USER_NS is not set
          # CONFIG_PID_NS is not set
          # CONFIG_FHANDLE is not set
          # CONFIG_RSEQ is not set
          # CONFIG_KSM is not set
          # CONFIG_MEMORY_FAILURE is not set
          # CONFIG_DEVTMPFS is not set
          # CONFIG_VT is not set
          # CONFIG_LEGACY_PTYS is not set
          # CONFIG_DEVMEM is not set
          # CONFIG_DEVPORT is not set
          # CONFIG_HWMON is not set
          # CONFIG_DNOTIFY is not set
          EOF
          echo "=== Optimization overlay created ==="

      - name: Build with Samsung Script
        run: |
          cd kernel
          
          export USE_BAZEL_VERSION=6.4.0
          export DEVICE_MODULES_DIR="kernel_device_modules-6.6"
          export BUILD_CONFIG="../out/target/product/a14m/obj/KERNEL_OBJ/build.config"
          export OUT_DIR="../out/target/product/a14m/obj/KLEAF_OBJ"
          export DIST_DIR="../out/target/product/a14m/obj/KLEAF_OBJ/dist"
          export DEFCONFIG_OVERLAYS="mt6768_overlay.config o22.config optimize_overlay.config"
          export PROJECT="mgk_64_k66"
          export MODE="user"
          
          python3 kernel_device_modules-6.6/scripts/gen_build_config.py \
            --kernel-defconfig mediatek-bazel_defconfig \
            --kernel-defconfig-overlays "mt6768_overlay.config o22.config optimize_overlay.config" \
            --kernel-build-config-overlays "" \
            -m user -o ../out/target/product/a14m/obj/KERNEL_OBJ/build.config
          
          chmod +x ./kernel_device_modules-6.6/build.sh
          ./kernel_device_modules-6.6/build.sh

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: A145P-Kernel-Output
          path: out/target/product/a14m/obj/KLEAF_OBJ/dist/*