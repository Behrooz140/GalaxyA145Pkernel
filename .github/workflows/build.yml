name: Build Kernel A145P

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g. v1.0). Leave empty to only build an artifact.'
        required: false
        default: ''
      include_modules:
        description: 'Include the freshly built kernel modules (.ko) in the package'
        type: boolean
        default: false

permissions:
  contents: write

env:
  DEVICE_MODULES_DIR: kernel_device_modules-6.6
  PROJECT: mgk_64_k66
  MODE: user
  # Base firmware release must stay identical to stock so the vermagic stamp
  # matches the prebuilt /vendor modules. The user-visible release string adds
  # the "behi" branding at the end:
  # 6.6.92-android15-8-abA145PXXSDDZH1-4k-behi-v1.4-oc
  # When bumping the version, update CONFIG_LOCALVERSION in
  # kernel-6.6/arch/arm64/configs/gki_defconfig as well.
  BUILD_NUMBER: A145PXXSDDZH1
  EXPECTED_KERNEL_RELEASE: 6.6.92-android15-8-abA145PXXSDDZH1-4k-behi-v1.4-oc
  STOCK_VERMAGIC: '6.6.92-android15-8-abA145PXXSDDZH1-4k SMP preempt mod_unload modversions aarch64'
  BRAND_SUFFIX: '-behi-v1.4-oc'
  KSU_TAG: v3.3.1
  KSU_COMMIT: 0c0fdb960178fa12d80d6cbcfdcb6ad8be6a865d
  KSU_COMMITS: '2680'
  DROIDSPACES_COMMIT: cdadb9eb5d0f86aacffff60776333e6f6b73a30a
  MBOOTIMG_COMMIT: d2bb0af5ba6d3198a3e99529c97eda1be0b5a093
  AVB_COMMIT: 3328b7b60ae384e1a92f44d7e6f3ac021c2b05be
  BOOT_PARTITION_SIZE: '33554432'
  # build.sh forwards $DEBUG_ARGS to bazel. --nokleaf_localversion makes the
  # workspace-status script use kernel-6.6/scripts/setlocalversion instead of
  # the git-hash path, so the release string is exactly the stock one.
  DEBUG_ARGS: --nokleaf_localversion

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4

      - name: Collect build metadata
        id: meta
        run: |
          set -euo pipefail
          {
            echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)"
            echo "FULL_SHA=$(git rev-parse HEAD)"
            echo "SHORT_SHA=$(git rev-parse --short=12 HEAD)"
          } >> "$GITHUB_ENV"

          VERSION=""
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [ -n "${{ inputs.release_tag }}" ]; then
            VERSION="${{ inputs.release_tag }}"
            VERSION="${VERSION#v}"
          fi
          if [ -z "$VERSION" ]; then
            VERSION="0.0.0-${SHORT_SHA}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          # Expose the value as a step output too: the expression env context
          # is not reliably populated from GITHUB_ENV.
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version: $VERSION"

      - name: Set up environment & sync AOSP toolchains
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y python3 git curl bc bison flex libssl-dev make zip nodejs \
            python-is-python3 rsync patch lz4

          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo > "$HOME/bin/repo"
          chmod a+x "$HOME/bin/repo"
          export PATH="$HOME/bin:$PATH"

          which repo
          repo --version

          git config --global user.name "Behrooz140"
          git config --global user.email "behrooz140@local.dev"

          mkdir aosp_toolchain
          cd aosp_toolchain
          repo init -u https://android.googlesource.com/kernel/manifest \
            -b common-android15-6.6 --depth=1
          repo sync -c -j"$(nproc)" --no-clone-bundle --no-tags --retry-fetches=3

          echo "AOSP_MANIFEST_COMMIT=$(git -C .repo/manifests rev-parse HEAD)" >> "$GITHUB_ENV"
          cd ..

          mkdir -p kernel/build kernel/external kernel/prebuilts kernel/tools
          rsync -a --exclude=".git" --exclude=".repo" aosp_toolchain/build/ kernel/build/
          rsync -a --exclude=".git" --exclude=".repo" aosp_toolchain/external/ kernel/external/
          rsync -a --exclude=".git" --exclude=".repo" aosp_toolchain/prebuilts/ kernel/prebuilts/
          rsync -a --exclude=".git" --exclude=".repo" aosp_toolchain/tools/ kernel/tools/

      - name: Fetch pinned image tools (mkbootimg + avbtool)
        run: |
          set -euo pipefail
          TOOLS="$GITHUB_WORKSPACE/.build-tools"
          rm -rf "$TOOLS"
          mkdir -p "$TOOLS"

          git clone -q https://android.googlesource.com/platform/system/tools/mkbootimg "$TOOLS/mkbootimg"
          git -C "$TOOLS/mkbootimg" checkout -q "${MBOOTIMG_COMMIT}"
          test "$(git -C "$TOOLS/mkbootimg" rev-parse HEAD)" = "${MBOOTIMG_COMMIT}"

          git clone -q https://android.googlesource.com/platform/external/avb "$TOOLS/avb"
          git -C "$TOOLS/avb" checkout -q "${AVB_COMMIT}"
          test "$(git -C "$TOOLS/avb" rev-parse HEAD)" = "${AVB_COMMIT}"
          python3 "$TOOLS/avb/avbtool.py" version

      - name: Apply pinned Droidspaces GKI patch
        run: |
          set -euo pipefail
          PATCH_URL="https://raw.githubusercontent.com/ravindu644/Droidspaces-OSS/${DROIDSPACES_COMMIT}/Documentation/resources/kernel-patches/GKI/below-kernel-6.12/001.GKI-below-6.12-fix_sysvipc_kabi_6_7_8.patch"

          mkdir -p droidspaces-patches
          curl -fL --retry 3 -o droidspaces-patches/001-sysvipc-kabi.patch "$PATCH_URL"
          sha256sum droidspaces-patches/001-sysvipc-kabi.patch | tee droidspaces-patches/SHA256SUMS

          cd kernel-6.6
          patch -p1 -N --dry-run < ../droidspaces-patches/001-sysvipc-kabi.patch
          patch -p1 -N < ../droidspaces-patches/001-sysvipc-kabi.patch
          grep -q "CONFIG_SYSVIPC" include/linux/sched.h
          echo "Droidspaces patch applied."

      - name: Set up KernelSU ${KSU_TAG}
        run: |
          set -euo pipefail
          cd kernel-6.6

          git clone https://github.com/tiann/KernelSU.git KernelSU
          cd KernelSU
          git checkout -q "${KSU_COMMIT}"
          test "$(git rev-parse HEAD)" = "${KSU_COMMIT}"
          KSU_COMMITS_ACTUAL="$(git rev-list --count HEAD)"
          echo "KernelSU commits: ${KSU_COMMITS_ACTUAL} (expected ${KSU_COMMITS})"
          test "${KSU_COMMITS_ACTUAL}" = "${KSU_COMMITS}"
          echo "KernelSU version: $((30000 + KSU_COMMITS_ACTUAL))"

          # Pin the version macro as well. The Bazel sandbox may not expose
          # KernelSU/.git, which would make Kbuild fall back to version 16 and
          # the manager would reject the kernel. 30000 + 2680 = 32680.
          KSU_VERSION="$((30000 + KSU_COMMITS))"
          # We are already inside the KernelSU checkout, so search the
          # current directory rather than a nested KernelSU/ path.
          find . -type f -name '*.c' \
            -exec sed -i "1i #undef KSU_VERSION\n#define KSU_VERSION ${KSU_VERSION}" {} +
          echo "Pinned KSU_VERSION=${KSU_VERSION}"
          cd ..

          ln -sfn "$(realpath --relative-to=drivers KernelSU/kernel)" drivers/kernelsu
          grep -q "kernelsu" drivers/Makefile || \
            printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile
          grep -q 'source "drivers/kernelsu/Kconfig"' drivers/Kconfig || \
            sed -i '/endmenu/i\source "drivers/kernelsu/Kconfig"' drivers/Kconfig

      - name: Enable required kernel configs
        run: |
          set -euo pipefail
          GKI_DEFCONFIG="kernel-6.6/arch/arm64/configs/gki_defconfig"

          for opt in \
            CONFIG_SYSVIPC \
            CONFIG_POSIX_MQUEUE \
            CONFIG_IPC_NS \
            CONFIG_PID_NS \
            CONFIG_DEVTMPFS \
            CONFIG_NETFILTER_XT_MATCH_ADDRTYPE \
            CONFIG_USER_NS \
            CONFIG_NETFILTER_XT_TARGET_REJECT \
            CONFIG_NETFILTER_XT_TARGET_LOG \
            CONFIG_NETFILTER_XT_MATCH_RECENT \
            CONFIG_IP_SET \
            CONFIG_IP_SET_HASH_IP \
            CONFIG_IP_SET_HASH_NET \
            CONFIG_NETFILTER_XT_SET \
            CONFIG_TMPFS_POSIX_ACL \
            CONFIG_TMPFS_XATTR
          do
            if grep -q "^${opt}=y" "$GKI_DEFCONFIG"; then
              echo "  already enabled: $opt"
            else
              sed -i "/# ${opt} is not set/d" "$GKI_DEFCONFIG"
              echo "${opt}=y" >> "$GKI_DEFCONFIG"
              echo "  enabled: $opt"
            fi
          done

          echo "=== Required configs ==="
          grep -E "^CONFIG_(SYSVIPC|POSIX_MQUEUE|IPC_NS|PID_NS|USER_NS|DEVTMPFS|IP_SET|NETFILTER_XT_SET|TMPFS_POSIX_ACL|TMPFS_XATTR)=y" "$GKI_DEFCONFIG"

          # Keep module compatibility with the previous working build: stock
          # modules on /vendor must keep loading, so do not enable the GKI
          # symbol-protection extra checks.
          sed -i "/^CONFIG_MODULE_SIG_PROTECT=/d" "$GKI_DEFCONFIG"
          sed -i "/# CONFIG_MODULE_SIG_PROTECT is not set/d" "$GKI_DEFCONFIG"
          echo "# CONFIG_MODULE_SIG_PROTECT is not set" >> "$GKI_DEFCONFIG"
          grep -q "^# CONFIG_MODULE_SIG_PROTECT is not set" "$GKI_DEFCONFIG"
          echo "Disabled CONFIG_MODULE_SIG_PROTECT (matches previous working build)"

      - name: Preflight localversion check
        run: |
          set -euo pipefail
          echo "DEBUG_ARGS=${DEBUG_ARGS:-}"
          case " ${DEBUG_ARGS:-} " in
            *" --nokleaf_localversion "*) ;;
            *) echo "ERROR: build must pass --nokleaf_localversion"; exit 1 ;;
          esac

          cd kernel
          # Mirror the build: --nokleaf_localversion means the stamp script uses
          # kernel-6.6/scripts/setlocalversion, i.e. no git hash is embedded.
          unset KLEAF_USE_KLEAF_LOCALVERSION
          MANIFEST="$PWD/${DEVICE_MODULES_DIR}/fake_manifest.xml"
          if grep -q 'repo_root_s, repo_manifest' \
              build/kernel/kleaf/workspace_status_stamp.py 2>/dev/null; then
            # Newer Kleaf expects KLEAF_REPO_MANIFEST as
            # <repo_root>:<manifest.xml>. The build itself passes only the
            # manifest path, which bazel.py upgrades using the workspace root.
            REPO_MANIFEST="$PWD:$MANIFEST"
          else
            REPO_MANIFEST="$MANIFEST"
          fi
          STATUS="$(BUILD_NUMBER="${BUILD_NUMBER}" \
            KLEAF_REPO_MANIFEST="$REPO_MANIFEST" \
            SOURCE_DATE_EPOCH="${SOURCE_DATE_EPOCH}" \
            python3 build/kernel/kleaf/workspace_status_stamp.py)"
          echo "$STATUS"
          SCM="$(printf '%s\n' "$STATUS" | sed -n 's/^STABLE_SCMVERSIONS //p' | python3 -c 'import json,sys; print(json.load(sys.stdin)["kernel-6.6"])')"
          echo "scmversion kernel-6.6: $SCM"
          ! printf '%s' "$SCM" | grep -q -- '-dirty'
          test "$SCM" = "-ab${BUILD_NUMBER}"
          echo "Version preflight OK -> ${EXPECTED_KERNEL_RELEASE}"

      - name: Build kernel
        run: |
          set -euo pipefail
          cd kernel

          export USE_BAZEL_VERSION=6.4.0
          export DEVICE_MODULES_DIR="kernel_device_modules-6.6"
          export BUILD_CONFIG="../out/target/product/a14m/obj/KERNEL_OBJ/build.config"
          export OUT_DIR="../out/target/product/a14m/obj/KLEAF_OBJ"
          export DIST_DIR="../out/target/product/a14m/obj/KLEAF_OBJ/dist"
          export DEFCONFIG_OVERLAYS="mt6768_overlay.config o22.config a145p_advanced.config"
          export PROJECT="mgk_64_k66"
          export MODE="user"

          python3 "${DEVICE_MODULES_DIR}/scripts/gen_build_config.py" \
            --kernel-defconfig mediatek-bazel_defconfig \
            --kernel-defconfig-overlays "mt6768_overlay.config o22.config a145p_advanced.config" \
            --kernel-build-config-overlays "" \
            -m user -o "${BUILD_CONFIG}"

          # Samsung's generated build.config.mtk prints warnings and an
          # "EXT_MODULES=..." debug line to stdout. Newer Kleaf's workspace
          # status script captures that stdout and treats each word as a
          # project path ("Project EXT_MODULES ... does not exist on disk").
          # The variables themselves are unaffected; drop only the echoes.
          GEN_DIR="$(dirname "${BUILD_CONFIG}")"
          test -f "${GEN_DIR}/build.config.mtk"
          # Replace the echoes with a no-op instead of deleting the lines:
          # some of them are the only statement in an if/else branch.
          sed -i 's#^\([[:space:]]*\)echo .*#\1:#' "${GEN_DIR}/build.config.mtk"

          chmod +x "./${DEVICE_MODULES_DIR}/build.sh"
          set +e
          "./${DEVICE_MODULES_DIR}/build.sh" 2>&1 | tee "${GITHUB_WORKSPACE}/build.log"
          BUILD_RC=${PIPESTATUS[0]}
          set -e
          echo "build.sh exit code: ${BUILD_RC}"
          exit "${BUILD_RC}"

      - name: Package release
        env:
          INCLUDE_MODULES: ${{ inputs.include_modules }}
        run: |
          set -euo pipefail
          DIST="out/target/product/a14m/obj/KLEAF_OBJ/dist"
          test -d "$DIST"

          IMAGE="$(find "$DIST" -type f -name Image | head -n1)"
          IMAGE_GZ="$(find "$DIST" -type f -name 'Image.gz' | head -n1)"
          SYSTEM_MAP="$(find "$DIST" -type f -name System.map | head -n1)"
          KCONFIG="$(find "$DIST" -type f -name '.config' | head -n1)"
          if [ -z "$KCONFIG" ]; then
            KCONFIG="$(find "$DIST" -type f -name 'config' | head -n1)"
          fi
          # Fallbacks: Kleaf sometimes leaves System.map/.config only in the
          # KLEAF_OBJ tree (or the merged defconfig under arch/arm64/configs).
          KOBJ="out/target/product/a14m/obj/KLEAF_OBJ"
          [ -n "$SYSTEM_MAP" ] || SYSTEM_MAP="$(find "$KOBJ" -type f -name System.map | head -n1)"
          if [ -z "$KCONFIG" ]; then
            KCONFIG="$(find "$KOBJ" -type f -path '*arch/arm64/configs/mediatek-bazel_defconfig' | head -n1)"
          fi
          for f in "$IMAGE" "$IMAGE_GZ" "$SYSTEM_MAP" "$KCONFIG"; do
            test -n "$f" && test -f "$f" || { echo "Missing build output"; exit 1; }
          done

          echo "=== Config sanity check ==="
          for opt in CONFIG_KSU CONFIG_SYSVIPC CONFIG_POSIX_MQUEUE CONFIG_IPC_NS CONFIG_PID_NS CONFIG_USER_NS CONFIG_MODVERSIONS; do
            grep -q "^${opt}=y" "$KCONFIG" || { echo "ERROR: ${opt} is not enabled in $KCONFIG"; exit 1; }
          done
          grep -q "^# CONFIG_MODULE_SIG_PROTECT is not set" "$KCONFIG" || {
            echo "ERROR: CONFIG_MODULE_SIG_PROTECT must stay disabled"; exit 1; }
          grep -q '^CONFIG_LOCALVERSION="-4k-behi-v1.4-oc"' "$KCONFIG" || {
            echo "ERROR: CONFIG_LOCALVERSION must be -4k-behi-v1.4-oc"; exit 1; }
          echo "KSU/SYSVIPC/namespaces enabled; SIG_PROTECT off; LOCALVERSION=-4k-behi-v1.4-oc"

          echo "=== Overclock table check (v1.4-oc) ==="
          OC_TABLE="kernel/kernel_device_modules-6.6/drivers/misc/mediatek/cpufreq_v2/src/plat_k68/mtk_cpufreq_opp_table.h"
          grep -Eq '^#define CPU_DVFS_FREQ0_LL_G75[[:space:]]+1900000' "$OC_TABLE" || {
            echo "ERROR: G75 little top OPP is not 1.9 GHz"; exit 1; }
          grep -Eq '^#define CPU_DVFS_FREQ0_L_G75[[:space:]]+2100000' "$OC_TABLE" || {
            echo "ERROR: G75 big top OPP is not 2.1 GHz"; exit 1; }
          grep -Eq '^#define CPU_DVFS_VOLT0_VPROC1_G75[[:space:]]+103125' "$OC_TABLE" || {
            echo "ERROR: G75 little top OPP voltage is not 1.03125 V"; exit 1; }
          grep -Eq '^#define CPU_DVFS_VOLT0_VPROC2_G75[[:space:]]+111250' "$OC_TABLE" || {
            echo "ERROR: G75 big top OPP voltage is not 1.1125 V"; exit 1; }
          echo "G75 OC table: little 1.9 GHz @ 1.03125 V, big 2.1 GHz @ 1.1125 V"

          echo "=== Advanced feature sanity check ==="
          for opt in \
            CONFIG_NET_SCH_CAKE CONFIG_MACVLAN \
            CONFIG_IP_NF_TARGET_TTL CONFIG_NETFILTER_XT_TARGET_HL CONFIG_IP6_NF_TARGET_HL \
            CONFIG_NETFILTER_XT_MATCH_CPU CONFIG_NETFILTER_XT_TARGET_CHECKSUM \
            CONFIG_SQUASHFS CONFIG_SQUASHFS_XZ CONFIG_SQUASHFS_LZ4 CONFIG_SQUASHFS_ZSTD \
            CONFIG_NFS_FS CONFIG_NFS_V4 CONFIG_NFS_V4_1 CONFIG_NFS_V4_2 CONFIG_CIFS \
            CONFIG_INPUT_JOYDEV CONFIG_RANDOMIZE_KSTACK_OFFSET_DEFAULT ; do
            grep -q "^${opt}=y" "$KCONFIG" || {
              echo "ERROR: ${opt} is not enabled in $KCONFIG"; exit 1; }
          done
          # USB serial stays a module exactly like the stock firmware (v1.0
          # booted with =m); the release does not ship .ko files.
          grep -q '^CONFIG_USB_SERIAL=m' "$KCONFIG" || {
            echo "ERROR: CONFIG_USB_SERIAL must stay =m (stock value)"; exit 1; }
          # KMI guard: these options changed the layout of exported GKI
          # structures in v1.1 and changed ~10k symbol CRCs, so every stock
          # /vendor module was rejected ("disagrees about version of symbol
          # module_layout") and the device bootlooped. Keep them off.
          for opt in \
            CONFIG_NF_TABLES CONFIG_NF_TABLES_INET CONFIG_NF_TABLES_IPV4 \
            CONFIG_NF_TABLES_IPV6 CONFIG_NF_TABLES_ARP CONFIG_NF_TABLES_NETDEV \
            CONFIG_NF_TABLES_BRIDGE CONFIG_NFT_NAT CONFIG_NFT_TPROXY \
            CONFIG_NETFILTER_XT_MATCH_CONNLABEL CONFIG_NF_CONNTRACK_LABELS \
            CONFIG_KSM CONFIG_VXLAN CONFIG_IPVLAN CONFIG_NET_L3_MASTER_DEV \
            CONFIG_LRU_GEN ; do
            if grep -q "^${opt}=" "$KCONFIG"; then
              echo "ERROR: ${opt} is enabled but it breaks the exported GKI ABI"; exit 1
            fi
          done
          echo "Advanced v1.2 config options present; KMI breakers disabled"

          echo "=== KMI compatibility gate ==="
          python3 scripts/kmi_check.py verify \
            --image "$IMAGE" \
            --system-map "$SYSTEM_MAP" \
            --baseline configs/kmi-baseline-v1.0.txt

          KERNEL_RELEASE="$(strings "$IMAGE" | sed -n 's/^Linux version \([^ ]*\) .*/\1/p' | head -n1)"
          echo "Detected kernel release: $KERNEL_RELEASE"
          if [ "$KERNEL_RELEASE" != "$EXPECTED_KERNEL_RELEASE" ]; then
            echo "ERROR: kernel release mismatch (expected $EXPECTED_KERNEL_RELEASE)"
            strings "$IMAGE" | grep -m3 '^Linux version' || true
            exit 1
          fi
          case "$KERNEL_RELEASE" in
            *"${BRAND_SUFFIX}") echo "Branding suffix present: ${BRAND_SUFFIX}" ;;
            *) echo "ERROR: kernel release is not branded with ${BRAND_SUFFIX}"; exit 1 ;;
          esac

          # The module ABI stamp must stay byte-identical to stock even though
          # the visible release string is branded; otherwise every prebuilt
          # /vendor module refuses to load (v1.1 regression).
          if ! strings "$IMAGE" | grep -qF "$STOCK_VERMAGIC"; then
            echo "ERROR: stock vermagic string not found in Image"
            strings "$IMAGE" | grep -m3 'SMP preempt' || true
            exit 1
          fi
          echo "Stock vermagic pinned: $STOCK_VERMAGIC"

          REL="release/A145P-Kernel-v${VERSION}"
          mkdir -p "$REL/images"

          cp -v "$IMAGE" "$REL/images/Image"
          cp -v "$IMAGE_GZ" "$REL/images/Image.gz"
          cp -v "$SYSTEM_MAP" "$REL/images/System.map"
          cp -v "$KCONFIG" "$REL/images/.config"
          cp -v "$KCONFIG" "$REL/images/config"

          if [ "${INCLUDE_MODULES}" = "true" ]; then
            mkdir -p "$REL/modules"
            find "$DIST" -type f -name '*.ko' -print0 | while IFS= read -r -d '' ko; do
              mkdir -p "$REL/modules/$(dirname "${ko#$DIST/}")"
              cp -v "$ko" "$REL/modules/${ko#$DIST/}"
            done
            echo "Included $(find "$REL/modules" -name '*.ko' | wc -l) modules."
          fi

          # CONFIG_MEDIATEK_CPU_DVFS=m, so the G75 OPP table - and with it the
          # overclock - is compiled into CPU_DVFS.ko which the device loads
          # from /vendor_dlkm/lib/modules. It is NOT part of Image, so the
          # module must ship with every OC build.
          DVFS_KO="$(find "$DIST" -type f -name 'CPU_DVFS.ko' | head -n1)"
          [ -n "$DVFS_KO" ] && [ -f "$DVFS_KO" ] || {
            echo "ERROR: CPU_DVFS.ko not found under $DIST"; exit 1; }
          cp -v "$DVFS_KO" "$REL/CPU_DVFS-v${VERSION}.ko"

          echo "=== CPU_DVFS.ko content check ==="
          python3 - "$REL/CPU_DVFS-v${VERSION}.ko" "$STOCK_VERMAGIC" <<'PY'
          import struct
          import sys

          path, stock_vermagic = sys.argv[1], sys.argv[2]
          blob = open(path, 'rb').read()
          failures = []

          if b'name=CPU_DVFS' not in blob:
              failures.append('module name is not CPU_DVFS')
          if stock_vermagic.encode() not in blob:
              failures.append('stock vermagic not found in module')

          for label, (freq, volt) in {
              'little 1.9 GHz @ 1.03125 V': (1900000, 103125),
              'big 2.1 GHz @ 1.1125 V': (2100000, 111250),
          }.items():
              count = blob.count(struct.pack('<II', freq, volt))
              print(f'  {label}: occurrences={count}')
              if not count:
                  failures.append(label)

          if failures:
              sys.exit('ERROR: CPU_DVFS.ko check failed: ' + ', '.join(failures))
          print('CPU_DVFS.ko carries the G75 overclock table and the stock vermagic')
          PY

          BOOT_IMG="$REL/A145P-Kernel-v${VERSION}-boot.img"
          MBOOTIMG="$GITHUB_WORKSPACE/.build-tools/mkbootimg/mkbootimg.py" \
          AVBTOOL="$GITHUB_WORKSPACE/.build-tools/avb/avbtool.py" \
          AVB_KEY="$GITHUB_WORKSPACE/.build-tools/avb/test/data/testkey_rsa4096.pem" \
          AVB_ALGORITHM="SHA256_RSA4096" \
          BOOT_PARTITION_SIZE="${BOOT_PARTITION_SIZE}" \
            bash scripts/build_boot_image.sh "$IMAGE_GZ" "$BOOT_IMG"

          # Odin package: boot.img inside a plain tar (and .tar.md5 variant).
          # Odin expects the partition image to be named boot.img inside the tar.
          ODIN_STAGE="$REL/.odin-stage"
          REL_ABS="$PWD/$REL"
          mkdir -p "$ODIN_STAGE"
          cp "$BOOT_IMG" "$ODIN_STAGE/boot.img"
          ODIN_NAME="A145P-Kernel-v${VERSION}-Odin.tar"
          (
            cd "$ODIN_STAGE"
            tar -cf "$ODIN_NAME" boot.img
            ODIN_MD5="$(md5sum "$ODIN_NAME" | cut -d' ' -f1)"
            # Samsung-style trailer: hash + final (renamed) file name.
            printf '%s  %s\n' "$ODIN_MD5" "${ODIN_NAME}.md5" >> "$ODIN_NAME"
            mv "$ODIN_NAME" "${ODIN_NAME}.md5"
            mv "${ODIN_NAME}.md5" "$REL_ABS/"
          )
          rm -rf "$ODIN_STAGE"

          # KernelSU module
          OUT_ZIP="$PWD/$REL/A145P-BatteryCare-v1.0.zip"
          (
            cd battery-care
            ZIP_INPUTS="module.prop post-fs-data.sh service.sh uninstall.sh bin"
            [ -f README.md ] && ZIP_INPUTS="$ZIP_INPUTS README.md"
            zip -r -q "$OUT_ZIP" $ZIP_INPUTS
          )
          test -s "$OUT_ZIP"

          # A145P Tuner KernelSU module
          OUT_TUNER="$PWD/$REL/A145P-Tuner-v${VERSION}.zip"
          (
            cd a145p-tuner
            ZIP_INPUTS="module.prop post-fs-data.sh service.sh uninstall.sh bin"
            [ -f README.md ] && ZIP_INPUTS="$ZIP_INPUTS README.md"
            zip -r -q "$OUT_TUNER" $ZIP_INPUTS
          )
          test -s "$OUT_TUNER"

          # Build info
          {
            echo "Kernel release : ${KERNEL_RELEASE}"
            echo "Package version: ${VERSION}"
            echo "Variant        : behi v1.4-oc (G75 overclock, a145p_advanced.config + A145P Tuner)"
            echo "Built at (UTC)  : $(date -u '+%Y-%m-%d %H:%M:%S')"
            echo "Source commit   : ${FULL_SHA}"
            echo "Source date     : $(date -u -d "@${SOURCE_DATE_EPOCH}" '+%Y-%m-%d %H:%M:%S') (SOURCE_DATE_EPOCH=${SOURCE_DATE_EPOCH})"
            echo "Build number    : ${BUILD_NUMBER} (localversion -ab suffix)"
            echo "AOSP manifest   : common-android15-6.6 @ ${AOSP_MANIFEST_COMMIT}"
            echo "KernelSU        : ${KSU_TAG} (${KSU_COMMIT}, ${KSU_COMMITS} commits, version $((30000 + KSU_COMMITS)))"
            echo "Droidspaces     : ${DROIDSPACES_COMMIT} (SYSVIPC kABI padding)"
            echo "mkbootimg       : ${MBOOTIMG_COMMIT}"
            echo "avbtool         : ${AVB_COMMIT}"
            echo "Boot partition  : ${BOOT_PARTITION_SIZE} bytes"
            echo "AVB signing key : AOSP testkey_rsa4096 (SHA256_RSA4096)"
            echo "Modules included: ${INCLUDE_MODULES}"
            echo "DVFS module     : CPU_DVFS-v${VERSION}.ko (vendor_dlkm, carries the G75 OC table)"
            echo "Stock config    : configs/stock-a145pxxsddzh1.config"
          } | tee "$REL/build-info.txt"

          cat > "$REL/RELEASE_NOTES.md" <<EOF
          # Galaxy A14 (SM-A145P) behi custom kernel ${VERSION}

          Kernel release: \`${KERNEL_RELEASE}\`
          Base firmware: \`A145PXXSDDZH1\`
          Built from commit: \`${FULL_SHA}\`

          ## Contents

          - \`A145P-Kernel-v${VERSION}-boot.img\` — 32 MiB boot image (header v4, AVB test-key signed)
          - \`A145P-Kernel-v${VERSION}-Odin.tar.md5\` — Odin AP slot package containing \`boot.img\`
          - \`images/Image\`, \`images/Image.gz\`, \`images/System.map\`, \`images/.config\`
            (the release asset named \`default.config\` is the same file as \`images/.config\`)
          - \`A145P-BatteryCare-v1.0.zip\` — KernelSU module for charge limiting (50–100 %)
          - \`A145P-Tuner-v${VERSION}.zip\` — KernelSU module with balanced/performance/battery profiles
          - \`CPU_DVFS-v${VERSION}.ko\` — CPU DVFS module carrying the overclocked G75 OPP table
            (must be copied to \`/vendor_dlkm/lib/modules/CPU_DVFS.ko\`; see below)
          - \`build-info.txt\`, \`SHA256SUMS\`

          ## Features

          - KernelSU ${KSU_TAG} (version $((30000 + KSU_COMMITS)))
          - SYSVIPC / POSIX mqueue / IPC + PID + USER namespaces (Droidspaces-ready)
          - TMPFS POSIX ACL/XATTR, netfilter/ipset additions
          - Battery Care support (Samsung \`batt_full_capacity\` interface)
          - CAKE qdisc, MACVLAN for containers (Droidspaces)
          - TTL/HL targets for tethering, cpu/checksum xtables helpers
          - SquashFS (XZ/LZ4/ZSTD), NFSv4.2, SMB/CIFS
          - USB serial core kept as a module exactly like the stock firmware
            (no \`.ko\` files are shipped, so USB-serial adapters need a module build)
          - Kernel stack offset randomization
          - ABI guard: exported symbol CRCs are compared with v1.0 on every build
          - **Experimental CPU overclock** (CPU level 6 / G75 table only):
            big cluster 2.0 → 2.1 GHz, little cluster 1.8 → 1.9 GHz, +25 mV

          ## Experimental CPU overclock (v1.4-oc)

          This build is an experiment, not a daily-driver recommendation. Only the
          top OPP of the G75 table (CPU level 6, the table the SM-A145P uses) is
          raised. The new frequencies take effect only after the overclocked
          \`CPU_DVFS-v${VERSION}.ko\` is installed (see below); the boot image alone
          keeps the stock clocks.

          | Cluster | Before | After | Vproc before | Vproc after |
          |---|---|---|---|---|
          | little (6 cores) | 1.8 GHz | 1.9 GHz | 1.00625 V | 1.03125 V |
          | big (2 cores) | 2.0 GHz | 2.1 GHz | 1.0875 V | 1.1125 V |

          Thermal throttling and all lower OPPs are untouched, so the kernel can
          still fall back under load. The new voltage stays below the PMIC limit
          enforced by `MAX_VPROC_VOLT` (1.12 V).

          Check the applied limits after boot:

          \`\`\`sh
          su -c 'grep . /sys/devices/system/cpu/cpufreq/policy*/cpuinfo_max_freq'
          \`\`\`

          Expected: \`policy0 = 1900000\`, \`policy6 = 2100000\`.

          ### Why a module and not only boot.img?

          The kernel is built with \`CONFIG_MEDIATEK_CPU_DVFS=m\`, exactly like the
          stock firmware, so the G75 OPP table lives inside \`CPU_DVFS.ko\`. That
          module is loaded by \`init\` from \`/vendor_dlkm/lib/modules\`, not from
          \`Image\`. Flashing the boot image alone therefore keeps the stock clocks.
          The overclocked table is shipped as \`CPU_DVFS-v${VERSION}.ko\` and has to
          replace the stock module of the same name.

          ### Installing the overclocked DVFS module

          Only do this after the matching boot image from this release is running
          (\`uname -r\` ends with \`${BRAND_SUFFIX}\`). Copy the download to
          \`/sdcard/Download/CPU_DVFS-v${VERSION}.ko\`, then:

          \`\`\`sh
          su -c '
            set -e
            M=/vendor_dlkm/lib/modules
            mount -o rw,remount /vendor_dlkm
            [ -f "\$M/CPU_DVFS.ko.stock" ] || cp -a "\$M/CPU_DVFS.ko" "\$M/CPU_DVFS.ko.stock"
            cat /sdcard/Download/CPU_DVFS-v${VERSION}.ko > "\$M/CPU_DVFS.ko"
            chown 0:0 "\$M/CPU_DVFS.ko"
            chmod 0644 "\$M/CPU_DVFS.ko"
            sync
            ls -lZ "\$M/CPU_DVFS.ko" "\$M/CPU_DVFS.ko.stock"
          '
          \`\`\`

          \`cat >\` (instead of \`cp\`) is intentional: it rewrites the existing inode,
          so the SELinux label of the stock module is preserved. The original is
          kept next to it as \`CPU_DVFS.ko.stock\`.

          Reboot, then verify:

          \`\`\`sh
          su -c 'grep . /sys/devices/system/cpu/cpufreq/policy*/cpuinfo_max_freq; dmesg | grep -i -E "CPU_DVFS|mt_cpufreq" | tail -20'
          \`\`\`

          If \`/vendor_dlkm\` cannot be remounted read-write (dm-verity enforcing),
          the module cannot be replaced at runtime; report the output of
          \`getprop ro.boot.veritymode\` instead of forcing it.

          ### Rollback (overclock)

          1. \`su -c 'mount -o rw,remount /vendor_dlkm && cp -a /vendor_dlkm/lib/modules/CPU_DVFS.ko.stock /vendor_dlkm/lib/modules/CPU_DVFS.ko && sync'\`
          2. Reboot. Clocks return to 1.8 / 2.0 GHz even on this kernel.
          3. For a complete rollback flash the v1.3 \`boot.img\` with Odin.

          If the device bootloops, overheats or apps crash, flash the v1.3
          \`boot.img\` to return to stock clocks. Overclocking is inherently
          silicon-dependent; not every MT6769V unit will be stable at these
          frequencies.

          ## Branding

          The release string carries the \`behi\` name and the package version, so
          Settings → About phone → Software information → Kernel version and
          \`uname -r\` show:

          \`\`\`
          6.6.92-android15-8-abA145PXXSDDZH1-4k-behi-v${VERSION}
          \`\`\`

          The module ABI stamp (vermagic) is deliberately pinned to the stock
          value \`6.6.92-android15-8-abA145PXXSDDZH1-4k SMP preempt mod_unload
          modversions aarch64\`, so the prebuilt modules in \`/vendor/lib/modules\`
          keep loading. Only the displayed release string changed.

          ## Requirements

          - **Unlocked bootloader** (the boot image is signed with a public AOSP test key, not Samsung's key).
          - Recommended: KernelSU manager ${KSU_TAG} or newer.

          ## Flash (Odin)

          1. Power the phone off.
          2. Enter Download mode: hold **Vol+ and Vol−** while connecting USB.
          3. Long-press **Vol+** to unlock the download mode warning.
          4. In Odin, put \`A145P-Kernel-v${VERSION}-Odin.tar.md5\` in the **AP** slot.
          5. **Do not** enable "Re-Partition". Flash and let the phone reboot.

          > The boot image carries a self-consistent AVB hash footer signed with a public
          > AOSP test key. With an unlocked bootloader this is accepted, exactly like the
          > previously working build.

          ## Battery Care (KernelSU module)

          Install \`A145P-BatteryCare-v1.0.zip\` from the KernelSU manager and reboot.
          Default limit is **85 %**. Change it with:

          \`\`\`sh
          su -c "/data/adb/battery-care/battery-care status"
          su -c "/data/adb/battery-care/battery-care on 80"
          su -c "/data/adb/battery-care/battery-care off"
          \`\`\`

          ## A145P Tuner (KernelSU module)

          Optional. Install \`A145P-Tuner-v${VERSION}.zip\` and reboot. The module
          applies the \`balanced\` profile by default; switch profiles with:

          \`\`\`sh
          su -c "/data/adb/a145p-tuner/a145p-tuner status"
          su -c "/data/adb/a145p-tuner/a145p-tuner profile battery"
          su -c "/data/adb/a145p-tuner/a145p-tuner profile performance"
          su -c "/data/adb/a145p-tuner/a145p-tuner profile balanced"
          \`\`\`

          All tunables are runtime-only and revert on reboot or module removal.
          The module never changes thermal limits, voltages or CPU frequencies.

          ## Rollback

          Flash your previous working boot image / full stock firmware via Odin (AP + CSC, HOME_CSC to keep data).

          ## Notes

          - Kernel modules already present on \`/vendor\` keep working: every exported
            symbol CRC is verified against the known-good v1.0 build (\`CONFIG_MODVERSIONS=y\`).
          - \`CONFIG_MODULE_SIG_PROTECT\` is disabled, matching the previous working build.
          - Verify with \`uname -r\` → \`${KERNEL_RELEASE}\`.
          EOF

          # Emit flat names: GitHub releases flatten the images/ directory, so a
          # checksum file that says "./images/Image" cannot be checked directly
          # against the downloaded assets. .config is skipped because the release
          # action publishes it under the fallback name "default.config"; its
          # hash is identical to config, which is listed.
          ( cd "$REL" && {
              find . -maxdepth 1 -type f ! -name 'SHA256SUMS' -print0
              find ./images -maxdepth 1 -type f ! -name '.config' -print0
            } | sort -z | xargs -0 sha256sum \
              | sed -E 's#  \./images/#  #; s#  \./#  #' > SHA256SUMS )

          echo "=== Package contents ==="
          find "$REL" -maxdepth 2 -type f -printf '%10s  %p\n' | sort -k2

      - name: Upload build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: A145P-Kernel-v${{ steps.meta.outputs.version }}
          path: |
            release/**
            build.log
          if-no-files-found: warn
          include-hidden-files: true
          compression-level: 6

      - name: Publish GitHub release (draft)
        if: success() && (startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          # Create the tag on the exact commit that was built, not on the
          # repository default branch.
          target_commitish: ${{ github.sha }}
          name: A145P behi Kernel ${{ steps.meta.outputs.version }}
          body_path: release/A145P-Kernel-v${{ steps.meta.outputs.version }}/RELEASE_NOTES.md
          files: |
            release/A145P-Kernel-v${{ steps.meta.outputs.version }}/A145P-Kernel-v${{ steps.meta.outputs.version }}-boot.img
            release/A145P-Kernel-v${{ steps.meta.outputs.version }}/A145P-Kernel-v${{ steps.meta.outputs.version }}-Odin.tar.md5
            release/A145P-Kernel-v${{ steps.meta.outputs.version }}/A145P-BatteryCare-v1.0.zip
            release/A145P-Kernel-v${{ steps.meta.outputs.version }}/A145P-Tuner-v${{ steps.meta.outputs.version }}.zip
            release/A145P-Kernel-v${{ steps.meta.outputs.version }}/CPU_DVFS-v${{ steps.meta.outputs.version }}.ko
            release/A145P-Kernel-v${{ steps.meta.outputs.version }}/RELEASE_NOTES.md
            release/A145P-Kernel-v${{ steps.meta.outputs.version }}/build-info.txt
            release/A145P-Kernel-v${{ steps.meta.outputs.version }}/SHA256SUMS
            release/A145P-Kernel-v${{ steps.meta.outputs.version }}/images/Image
            release/A145P-Kernel-v${{ steps.meta.outputs.version }}/images/Image.gz
            release/A145P-Kernel-v${{ steps.meta.outputs.version }}/images/System.map
            release/A145P-Kernel-v${{ steps.meta.outputs.version }}/images/.config
            release/A145P-Kernel-v${{ steps.meta.outputs.version }}/images/config
          draft: true
          prerelease: false
          fail_on_unmatched_files: true
