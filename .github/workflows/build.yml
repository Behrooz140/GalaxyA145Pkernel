on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 git curl bc bison flex libssl-dev make zip nodejs
          
          # 1. دانلود کامپایلر Clang
          rm -rf kernel/prebuilts/clang/host/linux-x86
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 kernel/prebuilts/clang/host/linux-x86
          
          # 2. دانلود Bazel Skylib
          rm -rf kernel/external/bazel-skylib
          mkdir -p kernel/external
          git clone --depth=1 https://github.com/bazelbuild/bazel-skylib.git kernel/external/bazel-skylib
          
          # 3. دانلود قوانین پایه بیزل (تلاش برای شاخه مخصوص کرنل 6.6 اندروید 15 یا شاخه اصلی)
          rm -rf kernel/build/bazel_common_rules
          git clone -b common-android15-6.6 --depth=1 https://android.googlesource.com/platform/build/bazel_common_rules kernel/build/bazel_common_rules || git clone --depth=1 https://android.googlesource.com/platform/build/bazel_common_rules kernel/build/bazel_common_rules
          
          # 4. دانلود JDK 11
          rm -rf kernel/prebuilts/jdk/jdk11
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/jdk/jdk11 kernel/prebuilts/jdk/jdk11
          
          # 5. ساخت مسیر فیزیکی sysroot و تزریق فایل برای عبور قطعی از ارور empty glob
          mkdir -p kernel/build/kernel/build-tools/sysroot
          touch kernel/build/kernel/build-tools/sysroot/.keep
          
          # 6. لینک کردن مسیر اجرایی بیزل
          mkdir -p kernel/prebuilts/kernel-build-tools/bazel/linux-x86_64/
          ln -sf $(which bazel) kernel/prebuilts/kernel-build-tools/bazel/linux-x86_64/bazel
          
          # 7. ایجاد فایل پایه بیلد
          touch kernel/build/BUILD.bazel
          
          # 8. جراحی فایل بیلد مدیاتک/سامسونگ و تزریق تارگت‌های فراموش شده
          echo 'toolchain_type(name = "hermetic_tools_toolchain_type")' >> kernel/build/kernel/BUILD.bazel
          echo 'toolchain_type(name = "hermetic_tools_toolchain")' >> kernel/build/kernel/BUILD.bazel

      - name: Build with Samsung Script
        run: |
          export USE_BAZEL_VERSION=6.4.0
          chmod +x build_kernel.sh
          ./build_kernel.sh

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: A145P-Kernel-Output
          path: out/target/product/a14m/obj/KLEAF_OBJ/dist/*
