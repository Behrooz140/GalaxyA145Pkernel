on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 git curl bc bison flex libssl-dev make zip nodejs
          
          # ساخت مسیر پیش‌نیازها و لینک کردن پایتون سرور
          mkdir -p kernel/prebuilts/build-tools/path/linux-x86/
          ln -s /usr/bin/python3 kernel/prebuilts/build-tools/path/linux-x86/python3
          
          # ساخت مسیر و لینک کردن ابزار کامپایلر Bazel
          mkdir -p kernel/prebuilts/kernel-build-tools/bazel/linux-x86_64/
          ln -s $(which bazel) kernel/prebuilts/kernel-build-tools/bazel/linux-x86_64/bazel
          
          # ایجاد فایل‌های BUILD ساختاری برای عبور از ارور پکیج
          mkdir -p kernel/prebuilts/clang/host/linux-x86/kleaf
          touch kernel/prebuilts/clang/host/linux-x86/kleaf/BUILD.bazel
          touch kernel/prebuilts/clang/host/linux-x86/BUILD.bazel

      - name: Build with Samsung Script
        run: |
          export USE_BAZEL_VERSION=6.4.0
          chmod +x build_kernel.sh
          ./build_kernel.sh

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: A145P-Kernel-Output
          path: out/target/product/a14m/obj/KLEAF_OBJ/dist/*
