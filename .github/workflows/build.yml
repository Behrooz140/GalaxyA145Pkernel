name: Build Kernel A145P

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Samsung Kernel Source
        uses: actions/checkout@v4

      - name: Set up Environment & Sync AOSP Toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 git curl bc bison flex libssl-dev make zip nodejs python-is-python3 rsync
          
          mkdir -p $HOME/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > $HOME/bin/repo
          chmod a+x $HOME/bin/repo
          export PATH="$HOME/bin:$PATH"
          
          # چک کردن که repo کار می‌کنه
          which repo
          repo --version
          
          git config --global user.name "Behrooz140"
          git config --global user.email "behrooz140@local.dev"
          
          mkdir aosp_toolchain
          cd aosp_toolchain
          repo init -u https://android.googlesource.com/kernel/manifest -b common-android15-6.6 --depth=1
          repo sync -c -j$(nproc) --no-clone-bundle --no-tags
          
          cd ..
          # ساخت پوشه‌ها برای اطمینان از عدم خطای rsync
          mkdir -p kernel/build kernel/external kernel/prebuilts kernel/tools
          
          # انتقال ابزارها دقیقاً به داخل پوشه kernel (جایی که بیزل به دنبال آن‌هاست)
          rsync -a --exclude=".git" --exclude=".repo" aosp_toolchain/build/ kernel/build/
          rsync -a --exclude=".git" --exclude=".repo" aosp_toolchain/external/ kernel/external/
          rsync -a --exclude=".git" --exclude=".repo" aosp_toolchain/prebuilts/ kernel/prebuilts/
          rsync -a --exclude=".git" --exclude=".repo" aosp_toolchain/tools/ kernel/tools/


      - name: Apply Droidspaces GKI Patches & Configs
        run: |
          set -e
          
          echo "=== Downloading Droidspaces kABI patch for kernel 6.6 ==="
          mkdir -p droidspaces-patches
          curl -L -o droidspaces-patches/001.GKI-below-6.12-fix_sysvipc_kabi_6_7_8.patch \
            "https://raw.githubusercontent.com/ravindu644/Droidspaces-OSS/main/Documentation/resources/kernel-patches/GKI/below-kernel-6.12/001.GKI-below-6.12-fix_sysvipc_kabi_6_7_8.patch"
          
          echo "=== Applying patch to kernel-6.6 ==="
          cd kernel-6.6
          
          patch -p1 -N < ../droidspaces-patches/001.GKI-below-6.12-fix_sysvipc_kabi_6_7_8.patch || true
          echo "Patch step finished"
          
          echo "=== Enabling Droidspaces configs in gki_defconfig ==="
          GKI_DEFCONFIG="arch/arm64/configs/gki_defconfig"
          
          # روش ساده و بدون sed پیچیده
          for opt in \
            CONFIG_SYSVIPC \
            CONFIG_POSIX_MQUEUE \
            CONFIG_IPC_NS \
            CONFIG_PID_NS \
            CONFIG_DEVTMPFS \
            CONFIG_NETFILTER_XT_MATCH_ADDRTYPE \
            CONFIG_USER_NS \
            CONFIG_NETFILTER_XT_TARGET_REJECT \
            CONFIG_NETFILTER_XT_TARGET_LOG \
            CONFIG_NETFILTER_XT_MATCH_RECENT \
            CONFIG_IP_SET \
            CONFIG_IP_SET_HASH_IP \
            CONFIG_IP_SET_HASH_NET \
            CONFIG_NETFILTER_XT_SET \
            CONFIG_TMPFS_POSIX_ACL \
            CONFIG_TMPFS_XATTR
          do
            if grep -q "^${opt}=y" "$GKI_DEFCONFIG"; then
              echo "  Already enabled: $opt"
            else
              # حذف خط قبلی اگر وجود داشته باشه (is not set)
              sed -i "/# ${opt} is not set/d" "$GKI_DEFCONFIG"
              echo "${opt}=y" >> "$GKI_DEFCONFIG"
              echo "  Added: $opt"
            fi
          done
          
          echo "=== Done. Current relevant configs: ==="
          grep -E "CONFIG_(SYSVIPC|POSIX_MQUEUE|IPC_NS|PID_NS|DEVTMPFS|USER_NS|NETFILTER_XT_MATCH_ADDRTYPE)=" "$GKI_DEFCONFIG" || true
          
          cd ..


      - name: Setup KernelSU
        run: |
          cd kernel-6.6
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -
          
          # جستجوی سراسری و تزریق هوشمند نسخه در تمام فایل‌های سورس KernelSU
          find KernelSU -type f -name "*.c" -exec sed -i '1i #undef KSU_VERSION\n#define KSU_VERSION 32525' {} +

      - name: Build with Samsung Script
        run: |
          cd kernel
          
          export USE_BAZEL_VERSION=6.4.0
          export DEVICE_MODULES_DIR="kernel_device_modules-6.6"
          export BUILD_CONFIG="../out/target/product/a14m/obj/KERNEL_OBJ/build.config"
          export OUT_DIR="../out/target/product/a14m/obj/KLEAF_OBJ"
          export DIST_DIR="../out/target/product/a14m/obj/KLEAF_OBJ/dist"
          export DEFCONFIG_OVERLAYS="mt6768_overlay.config o22.config"
          export PROJECT="mgk_64_k66"
          export MODE="user"
          
          # ساخت فایل کانفیگ
          python3 kernel_device_modules-6.6/scripts/gen_build_config.py \
            --kernel-defconfig mediatek-bazel_defconfig \
            --kernel-defconfig-overlays "mt6768_overlay.config o22.config" \
            --kernel-build-config-overlays "" \
            -m user -o ../out/target/product/a14m/obj/KERNEL_OBJ/build.config

          # ========================================
          # اینجا تنظیمات سبک‌سازی را اعمال می‌کنیم
          # ========================================
          echo "=== Applying lightweight config overrides ==="
          
          # پیدا کردن فایل کانفیگ نهایی
          FINAL_CONFIG="../out/target/product/a14m/obj/KERNEL_OBJ/build.config"
          
          if [ -f "$FINAL_CONFIG" ]; then
            # حذف خطوط قبلی این گزینه‌ها (اگر وجود داشته باشند)
            for opt in \
              CONFIG_DEBUG_INFO_BTF \
              CONFIG_KASAN_HW_TAGS \
              CONFIG_UBSAN \
              CONFIG_SCHED_DEBUG \
              CONFIG_SCHEDSTATS \
              CONFIG_HIST_TRIGGERS \
              CONFIG_FTRACE \
              CONFIG_CORESIGHT \
              CONFIG_CORESIGHT_LINK_AND_SINK_TMC \
              CONFIG_CORESIGHT_SOURCE_ETM4X \
              CONFIG_CORESIGHT_DUMMY \
              CONFIG_CORESIGHT_FUNNEL \
              CONFIG_CORESIGHT_REPLICATOR \
              CONFIG_CORESIGHT_TMC \
              CONFIG_MTK_AEE_FEATURE \
              CONFIG_MTK_AEE_AED \
              CONFIG_MTK_AEE_HANGDET \
              CONFIG_MTK_AEE_IPANIC \
              CONFIG_MTK_HANG_DETECT \
              CONFIG_IO_RECORD
            do
              # پاک کردن هر خطی که مربوط به این گزینه باشد
              sed -i "/${opt}/d" "$FINAL_CONFIG"
              # اضافه کردن نسخه غیرفعال
              echo "# ${opt} is not set" >> "$FINAL_CONFIG"
            done
            
            echo "Overrides applied to $FINAL_CONFIG"
            echo "===== Checking applied configs ====="
            grep -E "CONFIG_(DEBUG_INFO_BTF|KASAN|UBSAN|FTRACE|CORESIGHT|MTK_AEE|HANG_DETECT|IO_RECORD)" "$FINAL_CONFIG" || true
          else
            echo "WARNING: Final config not found at $FINAL_CONFIG"
          fi

          # اجرای اسکریپت اصلی بیلد
          chmod +x ./kernel_device_modules-6.6/build.sh
          ./kernel_device_modules-6.6/build.sh

echo "=== Searching for final .config ==="
          
          # جستجوی فایل .config
          FINAL_DOT_CONFIG=$(find ../out -name ".config" -type f | head -1)
          
          if [ -n "$FINAL_DOT_CONFIG" ]; then
            echo "Found final config at: $FINAL_DOT_CONFIG"
            cp "$FINAL_DOT_CONFIG" ../out/final_kernel_config.txt
            
            echo
            echo "===== Checking disabled options ====="
            grep -E "CONFIG_(DEBUG_INFO_BTF|KASAN_HW_TAGS|UBSAN|SCHED_DEBUG|SCHEDSTATS|HIST_TRIGGERS|FTRACE|CORESIGHT|MTK_AEE|HANG_DETECT|IO_RECORD)" "$FINAL_DOT_CONFIG" || true
          else
            echo "WARNING: .config not found!"
            find ../out -name "*config*" | head -30
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: A145P-Kernel-Output
          path: |
            out/target/product/a14m/obj/KLEAF_OBJ/dist/*
            out/final_kernel_config.txt